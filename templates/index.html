<!DOCTYPE html>
<html lang="en">
<head>

    <style>

        label { display: block; margin-top: 15px; font-weight: bold; }
        input[type="text"], input[type="tel"] { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; 
border-radius: 4px; box-sizing: border-box; }
        button { background-color: #007bff; color: white; padding: 12px 20px; border: none; border-radius: 4px; cursor: 
pointer; margin-top: 20px; width: 100%; font-size: 16px; }
        button:hover { background-color: #0056b3; }

</head>

        <h1>Secure Bank Login & Verification</h1>
